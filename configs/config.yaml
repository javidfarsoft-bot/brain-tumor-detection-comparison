project:
  name: "brain-tumor-detection-comparison"
  seed: 42

dataset:
  kaggle_id: "ahmedsorour1/mri-for-brain-tumor-with-bounding-boxes"
  raw_dir: "data/raw"            # original download: raw/{Train,Val}/{ClassName}/{images,labels}
  yolo_dir: "data/yolo"          # unified split: yolo/{train,valid,test}/{images,labels}, class_id rewritten
  coco_dir: "data/coco"          # converted format, used by Faster R-CNN

  # Confirmed from the actual Kaggle download: images/labels are split into
  # per-class subfolders (Glioma, Meningioma, Pituitary, "No Tumor"). Every
  # label .txt has class_id=0 — the real class comes from the folder name,
  # rewritten during the raw -> yolo merge step (see src/data/merge_dataset.py).
  class_names:
    - Glioma
    - Meningioma
    - Pituitary
    - "No Tumor"        # 4 classes total — brief mentions "five classes"; this dataset ships 4 (documented in report)

  # Raw dataset only ships Train/Val (no Test split). merge_dataset.py
  # re-splits ALL images 80/10/10, stratified per class, into data/yolo/{train,valid,test}.
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  img_size: 640

augmentation:
  horizontal_flip_p: 0.5
  rotate_limit: 10
  brightness_contrast_p: 0.2
  scale_range: [0.9, 1.1]

training:
  optimizer: "SGD"
  lr: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  batch_size: 16
  epochs: 100
  early_stopping_patience: 15
  num_workers: 4

fasterrcnn:
  backbone: "resnet50_fpn_v2"
  pretrained: true
  score_threshold: 0.5
  nms_threshold: 0.5

yolo:
  variant: "yolov8m.pt"
  pretrained: true

robustness:
  gaussian_blur_kernel: [5, 9]
  motion_blur_kernel: 9
  gaussian_noise_std: [10, 25]
  salt_pepper_amount: 0.02
  brightness_delta: [-40, 40]
  jpeg_quality: [20, 50]

explainability:
  method: "gradcam"
  target_layers_fasterrcnn: "backbone.body.layer4"
  target_layers_yolo: "model.model[-2]"
  num_samples_per_case: 5

statistics:
  bootstrap_n_resamples: 10000
  alpha: 0.05

paths:
  results_dir: "results"
  weights_dir: "outputs/weights"
  logs_dir: "results/logs"
