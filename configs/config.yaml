project:
  name: "brain-tumor-detection-comparison"
  seed: 42

dataset:
  kaggle_id: "ahmedsorour1/mri-for-brain-tumor-with-bounding-boxes"
  raw_dir: "data/raw"
  yolo_dir: "data/yolo"
  coco_dir: "data/coco"
  class_names:
    - Glioma
    - Meningioma
    - Pituitary
    - "No Tumor"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  img_size: 640

augmentation:
  horizontal_flip_p: 0.5
  rotate_degrees: 10
  brightness_contrast_p: 0.2
  # Ultralytics-only defaults explicitly disabled to match this policy:
  # mosaic=0, mixup=0, scale=0, translate=0, shear=0, perspective=0,
  # hsv_h=0, hsv_s=0 (hsv_v=0.2 kept as the brightness-jitter equivalent).
  # The albumentations package is uninstalled before YOLO training so its
  # default low-probability transforms (Blur, MedianBlur, ToGray, CLAHE)
  # are skipped, since they have no Faster R-CNN equivalent.

training:
  optimizer: "SGD"
  lr: 0.001
  momentum: 0.9
  weight_decay: 0.0005
  batch_size: 2
  max_epochs: 100
  early_stopping_patience: 15
  early_stopping_metric: "mAP@0.5 (validation)"
  num_workers: 2
  amp: true

fasterrcnn:
  backbone: "resnet50_fpn_v2"
  pretrained: true
  score_threshold: 0.5
  nms_threshold: 0.5
  lr_scheduler: "StepLR(step_size=30, gamma=0.1)"

yolo:
  variant: "yolov8n.pt"
  pretrained: true

robustness:
  gaussian_blur_ksize: 7
  motion_blur_ksize: 9
  gaussian_noise_sigma: 25
  salt_pepper_amount: 0.02
  lighting_darker_factor: 0.5
  lighting_brighter_factor: 1.5
  jpeg_quality: [20, 50]

explainability:
  method_yolo: "EigenCAM (manual SVD implementation)"
  method_fasterrcnn: "gradient-based CAM via forward/backward hooks"
  target_layer_yolo: "model.model.model[-2]"
  target_layer_fasterrcnn: "backbone.body.layer4"

statistics:
  bootstrap_n_resamples: 10000
  permutation_n_resamples: 10000
  alpha: 0.05

paths:
  results_dir: "results"
  weights_dir: "outputs/weights"
  checkpoint_dir_drive: "/content/drive/MyDrive/brain-tumor-project"
